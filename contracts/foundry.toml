[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

[etherscan]
arc_testnet = { key = "blockscout", url = "https://explorer.testnet.arc.io/api" }
